<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口コミ・返信確認</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f3f6f5;color:#20342c;margin:0}main{max-width:620px;margin:24px auto;padding:24px;background:white;border-radius:16px}h1{font-size:23px}section{background:#f4f7f6;padding:16px;border-radius:10px;margin:18px 0}textarea{box-sizing:border-box;width:100%;min-height:180px;font:inherit;padding:12px;border:1px solid #9aaea5;border-radius:8px}button{font:inherit;padding:13px;margin:10px 6px 0 0;border:0;border-radius:8px;background:#176a51;color:white}button:disabled{opacity:.45}.muted{color:#61746b;font-size:14px}#review{white-space:pre-wrap}#status{role:status}</style>
<main><h1>口コミ・返信確認</h1><p class="muted">返信案を確認・編集して、運用担当者へお送りください。</p><p id="status" role="status">読み込み中…</p><div id="content" hidden><h2 id="store"></h2><section><strong id="rating"></strong><p id="review"></p></section><label for="text">返信案（編集できます）</label><textarea id="text" maxlength="1500"></textarea><p class="muted">承認後、運用担当者が公開します。</p><button id="approve">この内容で承認</button><button id="consult">担当者に相談</button></div></main>
<script src="client-review-config.js"></script><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
// Public configuration only. Never put channel secrets/API keys in this object.
const config=window.LINE_CLIENT_REVIEW_CONFIG||{};
if(config.mode==='STAGING'){const badge=document.createElement('p');badge.textContent='STAGING・検証用。本番の口コミ公開は行いません。';badge.style.cssText='background:#fff3cc;padding:12px';document.querySelector('main').prepend(badge);}
const params=new URLSearchParams(location.search), demo=params.get('demo')==='1';let draft;
const $=id=>document.getElementById(id),status=message=>$('status').textContent=message;
async function call(body){const r=await fetch(config.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,id_token:liff.getIDToken()})});const result=await r.json();if(!r.ok)throw Error('処理できませんでした。画面を開き直すか、運用担当者へご連絡ください。');return result;}
function render(row){if(!row)throw Error('この口コミを確認する権限がないか、リンクが無効です。');draft=row;$('store').textContent=row.store_name;$('rating').textContent='評価：'+row.rating+' / 5';$('review').textContent=row.review||'本文なし';$('text').value=row.text;$('content').hidden=false;$('text').disabled=!row.editable;for(const id of ['approve','consult'])$(id).disabled=!row.editable;status(row.editable?'返信案を確認してください。':'確認済み、または担当者が処理中です。');}
async function submit(kind){let text=$('text').value;if(kind==='CHANGES_REQUESTED'){text=prompt('修正したい点・確認したい内容をご記入ください。');if(!text)return;}if(!text.trim()){status('内容を入力してください。');return;}for(const id of ['approve','consult'])$(id).disabled=true;try{if(!demo)await call({action:'decide',draft_id:draft.draft_id,version:draft.version,decision:kind,text,expected_text:draft.text});$('text').disabled=true;status((demo?'デモ：':'')+(kind==='APPROVED'?'承認を受け付けました。担当者が公開します。':'相談内容を担当者へ保存しました。'));}catch(e){status(e.message);for(const id of ['approve','consult'])$(id).disabled=false;}}
$('approve').onclick=()=>submit('APPROVED');$('consult').onclick=()=>submit('CHANGES_REQUESTED');
(async()=>{try{if(demo){render({draft_id:'demo',version:1,store_name:'サンプルカフェ（合成データ）',rating:5,review:'落ち着いた雰囲気で、スタッフの対応も丁寧でした。',text:'ご来店ありがとうございます。店内の雰囲気とスタッフの対応をお褒めいただき、うれしく思います。またのお越しをお待ちしております。',editable:true});status('デモ画面です。送信・保存・公開は行いません。');return;}if(!config.liffId||!config.endpoint)throw Error('LINE連携の準備中です。運用担当者へご連絡ください。');await liff.init({liffId:config.liffId});if(!liff.isLoggedIn()){liff.login();return;}render(await call({action:'view',draft_id:params.get('draft_id'),version:1}));}catch(e){status(e.message);}})();
</script></html>
